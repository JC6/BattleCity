plugins {
    id 'com.android.application' version '9.4.1'
}

def gameData = layout.buildDirectory.dir('generated/game-data').get().asFile
def generateGameData = tasks.register('generateGameData', Exec) {
    inputs.files('web/src/game/pixel-assets.ts', 'web/src/data/levels.ts',
            'web/src/data/original.ts', 'web/src/core/constants.ts',
            'web/src/core/rules.ts', 'web/src/core/types.ts', 'web/src/platform/audio-cues.ts')
    inputs.files('tools/export-android.mjs', 'tools/templates/ic_launcher.xml')
    outputs.dir(gameData)
    commandLine 'node', file('tools/export-android.mjs'), '--output', gameData
}

android {
    namespace = 'org.jiangc.bc'
    enableKotlin = false
    compileSdk {
        version = release(37) { minorApiLevel = 2 }
    }

    defaultConfig {
        applicationId = 'org.jiangc.bc'
        minSdk = 34
        targetSdk = 37
        versionCode = 2
        versionName = '2.0.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src', new File(gameData, 'java')]
            res.srcDirs = ['res', new File(gameData, 'res')]
            assets.srcDirs = [new File(gameData, 'assets')]
        }
        test.java.srcDirs = ['tests/unit']
        androidTest.java.srcDirs = ['tests/device']
    }
    lint {
        checkDependencies = true
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation files('libs/andengine.jar')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}

tasks.named('preBuild').configure { dependsOn generateGameData }
tasks.withType(Test).configureEach {
    dependsOn generateGameData
    inputs.file('web/tests/game/fixtures/native-golden.json')
    systemProperty 'battlecity.generatedDataDir', gameData.absolutePath
}
