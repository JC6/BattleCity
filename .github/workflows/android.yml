name: Legacy Android diagnostics

on:
  workflow_dispatch:
    inputs:
      engine_diagnostics:
        description: Collect engine and activity lifecycle diagnostics
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BATTLECITY_ENGINE_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && inputs.engine_diagnostics || false }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '15859902'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Use the installed Android command-line tools
        run: |
          installed_tools=$(dirname "$(dirname "$(command -v sdkmanager)")")
          latest_tools="$ANDROID_HOME/cmdline-tools/latest"
          # emulator-runner prepends latest/bin, which may contain older runner-image tools.
          if [[ "$(readlink -f "$latest_tools")" != "$(readlink -f "$installed_tools")" ]]; then
            if [[ -e "$latest_tools" || -L "$latest_tools" ]]; then
              mv "$latest_tools" "$RUNNER_TEMP/android-cmdline-tools-preinstalled"
            fi
            ln -s "$installed_tools" "$latest_tools"
          fi
          "$latest_tools/bin/sdkmanager" --version
          "$latest_tools/bin/sdkmanager" --install --channel=0 'platforms;android-34' 'build-tools;37.0.0' \
            platform-tools emulator 'system-images;android-34;android-tv;x86'
      - name: Check acceptance report validation
        run: python3 -m unittest discover -s tests/ci -v
      - name: Initialize runner ADB authentication
        run: bash tools/prepare-android-tv.sh authorize
      - name: Build, unit tests and lint
        id: checks
        run: |
          bash ./gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest --stacktrace
          mkdir -p build/diagnostics
          sha256sum build/outputs/apk/debug/BattleCity-debug.apk \
            build/outputs/apk/androidTest/debug/BattleCity-debug-androidTest.apk > build/diagnostics/apks-built.sha256
      - name: Enable emulator acceleration
        id: acceleration
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics/kvm
          {
            id || exit "$?"
            ls -l /dev/kvm || exit "$?"
            if [[ ! -c /dev/kvm ]]; then
              echo '/dev/kvm is not a character device' >&2
              exit 1
            fi
            sudo chmod a+rw /dev/kvm || exit "$?"
            ls -l /dev/kvm || exit "$?"
            python3 -c 'import os; fd = os.open("/dev/kvm", os.O_RDWR); os.close(fd); print("KVM device opened for read/write")'
          } 2>&1 | tee build/diagnostics/kvm/setup.txt
      - name: API 34 TV production baseline
        id: baseline
        continue-on-error: true
        uses: ./.github/actions/android-tv-round
        with:
          round: baseline
          port: '5554'
      - name: API 34 TV VBO diagnostic
        id: comparison1
        continue-on-error: true
        uses: ./.github/actions/android-tv-round
        with:
          round: comparison-1
          port: '5556'
      - name: Check whether to repeat the VBO diagnostic
        id: after_first
        env:
          BASELINE_STATUS: ${{ steps.baseline.outcome }}
          COMPARISON_1_STATUS: ${{ steps.comparison1.outcome }}
        run: python3 tools/check-android-results.py --comparison-progress 1
      - name: API 34 TV VBO diagnostic repeat 1
        id: comparison2
        if: steps.after_first.outputs.repeat == 'true'
        continue-on-error: true
        uses: ./.github/actions/android-tv-round
        with:
          round: comparison-2
          port: '5558'
      - name: Check whether to run the final VBO diagnostic
        id: after_second
        if: steps.after_first.outputs.repeat == 'true'
        env:
          BASELINE_STATUS: ${{ steps.baseline.outcome }}
          COMPARISON_1_STATUS: ${{ steps.comparison1.outcome }}
          COMPARISON_2_STATUS: ${{ steps.comparison2.outcome }}
        run: python3 tools/check-android-results.py --comparison-progress 2
      - name: API 34 TV VBO diagnostic repeat 2
        id: comparison3
        if: steps.after_second.outputs.repeat == 'true'
        continue-on-error: true
        uses: ./.github/actions/android-tv-round
        with:
          round: comparison-3
          port: '5560'
      - name: Verify and summarize acceptance
        if: always()
        env:
          BUILD_STATUS: ${{ steps.checks.outcome }}
          BASELINE_STATUS: ${{ steps.baseline.outcome }}
          COMPARISON_1_STATUS: ${{ steps.comparison1.outcome }}
          COMPARISON_2_STATUS: ${{ steps.comparison2.outcome }}
          COMPARISON_3_STATUS: ${{ steps.comparison3.outcome }}
        run: python3 tools/check-android-results.py --paired
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-reports-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/
            build/test-results/
            build/outputs/androidTest-results/
            build/diagnostics/
          retention-days: 7
