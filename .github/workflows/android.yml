name: BattleCity Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      engine_diagnostics:
        description: Collect engine and activity lifecycle diagnostics
        type: boolean
        default: false
      tv_vbo_mode:
        description: API 34 TV VBO experiment (disabled is diagnostic only)
        type: choice
        default: default
        options: [default, disabled]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BATTLECITY_ENGINE_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && inputs.engine_diagnostics || false }}
      BATTLECITY_TV_VBO_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.tv_vbo_mode || 'default' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '15859902'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Use the installed Android command-line tools
        run: |
          installed_tools=$(dirname "$(dirname "$(command -v sdkmanager)")")
          latest_tools="$ANDROID_HOME/cmdline-tools/latest"
          # emulator-runner prepends latest/bin, which may contain older runner-image tools.
          if [[ "$(readlink -f "$latest_tools")" != "$(readlink -f "$installed_tools")" ]]; then
            if [[ -e "$latest_tools" || -L "$latest_tools" ]]; then
              mv "$latest_tools" "$RUNNER_TEMP/android-cmdline-tools-preinstalled"
            fi
            ln -s "$installed_tools" "$latest_tools"
          fi
          "$latest_tools/bin/sdkmanager" --version
          "$latest_tools/bin/sdkmanager" 'platforms;android-37.2'
      - name: Check acceptance report validation
        run: python3 -m unittest discover -s tests/ci -v
      - name: Build, unit tests and lint
        id: checks
        run: |
          bash ./gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        id: acceleration
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics/kvm
          {
            id || exit "$?"
            ls -l /dev/kvm || exit "$?"
            if [[ ! -c /dev/kvm ]]; then
              echo '/dev/kvm is not a character device' >&2
              exit 1
            fi
            sudo chmod a+rw /dev/kvm || exit "$?"
            ls -l /dev/kvm || exit "$?"
            python3 -c 'import os; fd = os.open("/dev/kvm", os.O_RDWR); os.close(fd); print("KVM device opened for read/write")'
          } 2>&1 | tee build/diagnostics/kvm/setup.txt
      - name: API 34 TV framework smoke tests
        id: device34
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          pre-emulator-launch-script: mkdir -p build/diagnostics/emulator-api-34
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -logcat-output ${{ github.workspace }}/build/diagnostics/emulator-api-34/startup-logcat.txt
          script: bash tools/run-android-device-tests.sh 34
      - name: API 37.2 phone (16 KB) framework smoke tests
        if: ${{ !cancelled() && steps.checks.outcome == 'success' && steps.acceleration.outcome == 'success' }}
        id: device37
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: '37.2'
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_2
          pre-emulator-launch-script: mkdir -p build/diagnostics/emulator-api-37.2
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -logcat-output ${{ github.workspace }}/build/diagnostics/emulator-api-37.2/startup-logcat.txt
          script: bash tools/run-android-device-tests.sh 37.2
      - name: Verify and summarize acceptance
        if: always()
        env:
          BUILD_STATUS: ${{ steps.checks.outcome }}
          DEVICE_API34_STATUS: ${{ steps.device34.outcome }}
          DEVICE_API37_STATUS: ${{ steps.device37.outcome }}
        run: python3 tools/check-android-results.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && format('android-reports-{0}-tv-vbo-{1}-{2}', github.sha, env.BATTLECITY_TV_VBO_MODE, github.run_id) || format('android-reports-{0}', github.sha) }}
          path: |
            build/reports/
            build/test-results/
            build/outputs/androidTest-results/
            build/diagnostics/
          retention-days: 7
