name: BattleCity Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: sdkmanager 'platforms;android-37.2'
      - name: Check acceptance report validation
        run: python3 -m unittest discover -s tests/ci -v
      - name: Build, unit tests and lint
        id: checks
        run: |
          bash ./gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        id: acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: API 34 framework smoke tests
        id: device34
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: bash tools/run-android-device-tests.sh 34
      - name: API 37.2 framework smoke tests
        if: ${{ !cancelled() && steps.checks.outcome == 'success' && steps.acceleration.outcome == 'success' }}
        id: device37
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: '37.2'
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_2
          script: bash tools/run-android-device-tests.sh 37.2
      - name: Verify and summarize acceptance
        if: always()
        env:
          BUILD_STATUS: ${{ steps.checks.outcome }}
          DEVICE_API34_STATUS: ${{ steps.device34.outcome }}
          DEVICE_API37_STATUS: ${{ steps.device37.outcome }}
        run: python3 tools/check-android-results.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-reports-${{ github.sha }}
          path: |
            build/reports/
            build/test-results/
            build/outputs/androidTest-results/
            build/diagnostics/
          retention-days: 7
