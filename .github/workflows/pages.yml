name: Final Android TV device acceptance
on:
  push:
    branches: [validation/switch-parity-tv-20261124]
permissions:
  actions: read
  contents: read
jobs:
  television:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45357491258
          name: game-tv-emulator
          path: deliverable
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45357491258
          name: cartridge
          path: build/shared
      - name: Verify the packaged x86 release and card identity
        run: |
          expected=72259aab96d617eb7c9feeba91ee9426c4d80e7d3b51b86edf204fecf6789741
          echo "$expected  build/shared/game.nes" | sha256sum -c -
          python3 tests/nes/switch_lettering.py build/shared/game.nes build/shared/game.lbl --secondary
          mkdir -p build/tv-result
          sha256sum deliverable/tv-emulator.apk build/shared/game.nes > build/tv-result/tested-sha256.txt
          python3 tests/nes/package.py deliverable/tv-emulator.apk build/shared/game.nes --abi x86
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare the PNG screenshot decoder
        timeout-minutes: 12
        run: |
          if command -v ffmpeg >/dev/null; then exit 0; fi
          cd "$RUNNER_TEMP"
          curl -fLSs --retry 3 https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz -o ffmpeg-7.1.1.tar.xz
          echo '733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1  ffmpeg-7.1.1.tar.xz' | sha256sum -c -
          tar -xf ffmpeg-7.1.1.tar.xz
          cd ffmpeg-7.1.1
          ./configure --disable-everything --disable-autodetect --disable-doc --disable-debug \
            --disable-ffplay --disable-ffprobe --disable-network --disable-x86asm --enable-zlib \
            --enable-decoder=png --enable-parser=png --enable-demuxer=image_png_pipe --enable-protocol=pipe \
            --enable-filter=scale,format,buffer,buffersink --enable-encoder=rawvideo --enable-muxer=rawvideo
          make -j"$(nproc)" ffmpeg
          ./ffmpeg -loglevel error -i pipe:0 -vf scale=320:180 -frames:v 1 -threads 1 \
            -f rawvideo -pix_fmt rgb24 pipe:1 < "$GITHUB_WORKSPACE/runtime/android/src/main/res/drawable-xhdpi/game_icon.png" > sample.rgb
          test "$(wc -c < sample.rgb)" -eq 172800
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Boot the Android SDK television image and test both gamepads
        timeout-minutes: 30
        env:
          ANDROID_SERIAL: emulator-5554
        run: |
          exec > >(tee "$RUNNER_TEMP/battlecity-test.log") 2>&1
          bash tests/nes/television-avd.sh deliverable/tv-emulator.apk build/shared/game.lbl build/tv-result --suite scenes
      - name: Report the failed build or device check
        if: failure()
        shell: python
        run: |
          import os
          import re
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          log = temporary / 'battlecity-test.log'
          if not log.is_file():
              log = temporary / 'battlecity-build.log'
          if log.is_file():
              lines = log.read_text(errors='replace').splitlines()
              errors = [line for line in lines if re.search(
                  r'error|fatal|failed|no space|not found|no such|exception|make.*\*\*\*', line, re.I)]
              for line in (errors or lines)[-10:]:
                  print('::error::' + line[-500:].replace('%', '%25'))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-device-results
          path: build/tv-result/
