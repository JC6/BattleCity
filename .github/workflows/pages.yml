name: BattleCity Web

on:
  push:
    branches: [master, 'validation/switch-parity-*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      previous_tv_run:
        description: Optional previous Actions run for the Android save upgrade test
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  runtime:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/mame-runtime.yml
    with:
      previous_tv_run: ${{ inputs.previous_tv_run || (startsWith(github.ref, 'refs/heads/validation/switch-parity-swap-') && '45761439730') || (startsWith(github.ref, 'refs/heads/validation/switch-parity-damage-') && '45744441858') || (startsWith(github.ref, 'refs/heads/validation/switch-parity-buffer-') && '45715102305') || (startsWith(github.ref, 'refs/heads/validation/switch-parity-sampling-') && '45649698219') || (startsWith(github.ref, 'refs/heads/validation/switch-parity-egl-') && '45560615317') || (startsWith(github.ref, 'refs/heads/validation/switch-parity-partial-') && '45537473297') || (startsWith(github.ref, 'refs/heads/validation/switch-parity-compositor-') && '45426153747') || (startsWith(github.ref, 'refs/heads/validation/switch-parity-native-window-20261124') && '45394628713') || '' }}

  acceptance:
    if: startsWith(github.ref, 'refs/heads/validation/switch-parity-swap-') || inputs.previous_tv_run != ''
    needs: runtime
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: inputs/current
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.previous_tv_run || '45761439730' }}
          name: web-clock-and-endings
          path: inputs/previous/web-clock-and-endings
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify game packages and assemble the comparison
        run: python3 tools/package-switch-acceptance.py inputs/current inputs/previous delivery --identity "$GITHUB_SHA / $GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switch-acceptance
          path: |
            delivery/SHA256SUMS
            delivery/Switch-TV-Comparison.html
            delivery/Switch-TV-Measurements.zip
            delivery/menu-sizes.csv
          if-no-files-found: error

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: game-web
          path: package
      - run: unzip -q package/BattleCity-Web.zip -d site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
