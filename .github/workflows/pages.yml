name: BattleCity Web

on:
  push:
    branches: [master, 'validation/switch-parity-*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      previous_tv_run:
        description: Optional previous Actions run for the Android save upgrade test
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  runtime:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/mame-runtime.yml
    with:
      previous_tv_run: ${{ inputs.previous_tv_run || (startsWith(github.ref, 'refs/heads/validation/switch-parity-egl-') && '45560615317') || (startsWith(github.ref, 'refs/heads/validation/switch-parity-partial-') && '45537473297') || (startsWith(github.ref, 'refs/heads/validation/switch-parity-compositor-') && '45426153747') || (startsWith(github.ref, 'refs/heads/validation/switch-parity-native-window-20261124') && '45394628713') || '' }}

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: game-web
          path: package
      - run: unzip -q package/BattleCity-Web.zip -d site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
