name: Package measured Switch comparison

on:
  workflow_call:
    inputs:
      tested:
        type: string
        required: true
      previous:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tested:
        description: Tested BattleCity Web run ID
        type: string
        required: true
      previous:
        description: Baseline BattleCity Web run ID
        type: string
        required: true
  push:
    branches: ['validation/switch-report-*']

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - id: runs
        env:
          TESTED: ${{ inputs.tested }}
          PREVIOUS: ${{ inputs.previous }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ -z "$TESTED" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^validation/switch-report-([0-9]+)-([0-9]+)(-([0-9]+))?$ ]]
            TESTED=${BASH_REMATCH[1]} PREVIOUS=${BASH_REMATCH[2]}
            echo "upgrade_from=${BASH_REMATCH[4]:-}" >> "$GITHUB_OUTPUT"
          fi
          [[ "$TESTED" =~ ^[0-9]+$ && "$PREVIOUS" =~ ^[0-9]+$ && "$TESTED" != "$PREVIOUS" ]]
          revision=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED" --jq .head_sha)
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "tested=$TESTED" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.tested }}
          path: inputs/current
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.previous }}
          name: web-clock-and-endings
          path: inputs/previous/web-clock-and-endings
      - name: Fetch the rejected focus experiment for releases with the restored menu
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ steps.runs.outputs.tested }}
        run: |
          branch=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED" --jq .head_branch)
          if [[ "$branch" == validation/switch-parity-floor-release-* ]]; then
            trial=45913081159
            folder=inputs/current/focus-trial
            mkdir -p "$folder"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$trial" --jq '{run: .id, revision: .head_sha}' > "$folder/identity.json"
            jq -e '.revision=="0010063f79f8c3a8dec25bae16e441e7010219e6"' "$folder/identity.json"
            gh run download "$trial" --name tv-device-results --dir "$folder/tv-device-results"
            gh run download "$trial" --name web-clock-and-endings --dir "$folder/web-clock-and-endings"
          fi
      - uses: actions/download-artifact@v4
        if: steps.runs.outputs.upgrade_from != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.upgrade_from }}
          name: game-web
          path: inputs/replay/previous
      - uses: actions/setup-node@v6
        if: steps.runs.outputs.upgrade_from != ''
        with:
          node-version: '24'
      - name: Replay the WebKit upgrade with the exact archived packages
        if: steps.runs.outputs.upgrade_from != ''
        env:
          TESTED: ${{ steps.runs.outputs.tested }}
          UPGRADE_FROM: ${{ steps.runs.outputs.upgrade_from }}
          BATTLECITY_UPGRADE_URL: http://127.0.0.1:8765/
        run: |
          set -euo pipefail
          cp -r inputs/current/game-web inputs/replay/current
          cp -r inputs/current/cartridge inputs/replay/cartridge
          (cd inputs/replay && sha256sum -c ../current/upgrade-webkit/packages.sha256)
          site="$RUNNER_TEMP/replay-site"
          mkdir -p "$site/previous" "$RUNNER_TEMP/upgrade-webkit/screens"
          python3 -m zipfile -e inputs/replay/current/BattleCity-Web.zip "$site"
          python3 -m zipfile -e inputs/replay/previous/BattleCity-Web.zip "$site/previous"
          npm ci --prefix web
          (cd web && npx playwright install --with-deps webkit)
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$site" &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 8 --retry-connrefused -fsS "$BATTLECITY_UPGRADE_URL" -o /dev/null
          export BATTLECITY_CAPTURE_DIR="$RUNNER_TEMP/upgrade-webkit/screens"
          node tests/nes/browser-game.cjs "${BATTLECITY_UPGRADE_URL}previous/" inputs/replay/cartridge/game.lbl webkit controls | tee "$RUNNER_TEMP/upgrade-webkit/upgrade-webkit.log"
          old=inputs/current/upgrade-webkit
          cp "$old/packages.sha256" "$RUNNER_TEMP/upgrade-webkit/"
          cp "$old/upgrade-webkit.log" "$RUNNER_TEMP/upgrade-webkit/original-attempt.log"
          printf 'replay=%s tested=%s upgrade_from=%s\n' "$GITHUB_RUN_ID" "$TESTED" "$UPGRADE_FROM" > "$RUNNER_TEMP/upgrade-webkit/replay.txt"
          mv "$old" inputs/replay/original-observations
          mv "$RUNNER_TEMP/upgrade-webkit" "$old"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Recheck hashes, device receipts, regressions and menu samples
        env:
          REVISION: ${{ steps.runs.outputs.revision }}
          TESTED: ${{ steps.runs.outputs.tested }}
          PREVIOUS: ${{ steps.runs.outputs.previous }}
        run: |
          python3 tests/nes/test_ending_parity.py
          python3 tools/package-switch-acceptance.py inputs/current inputs/previous delivery --identity "$REVISION / $TESTED (baseline $PREVIOUS)"
          (cd delivery && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switch-acceptance
          path: |
            delivery/SHA256SUMS
            delivery/Switch-TV-Comparison.html
            delivery/Switch-TV-Measurements.zip
            delivery/menu-sizes.csv
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switch-acceptance-manifest
          path: |
            delivery/SHA256SUMS
            delivery/menu-sizes.csv
            inputs/current/presentation-cost.csv
            inputs/current/tv-device-results/release-gate.json
          if-no-files-found: error
