name: Validate the packaged TV build
on:
  push:
    branches: [validation/switch-parity-20261123]
    paths: [.github/workflows/validation-log-check.yml, tests/nes/television.py, tests/nes/television-avd.sh]
permissions:
  contents: read
  actions: read
jobs:
  television:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45097880547
          name: game-tv-emulator
          path: deliverable
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45097880547
          name: cartridge
          path: build/shared
      - name: Verify the verified cartridge and exercise both gamepads
        run: |
          echo 'd0cf0118f70514d674c17b699cf1c3463acdf439070d64b697bab31a125bf35f  build/shared/game.nes' | sha256sum -c -
          python3 tests/nes/package.py deliverable/tv-emulator.apk build/shared/game.nes --abi x86
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          bash tests/nes/television-avd.sh deliverable/tv-emulator.apk build/shared/game.lbl build/tv-result
      - name: Report device errors
        if: failure()
        shell: python
        run: |
          import re
          from pathlib import Path
          p=Path('build/tv-result/device.log')
          if p.is_file():
              lines=p.read_text(errors='replace').splitlines()
              errors=[x for x in lines if re.search(r'error|fatal|failed|timed out|no such|exception',x,re.I)]
              for line in (errors or lines)[-6:]:print('::error::'+line[:450].replace('%','%25'))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-device-results
          path: build/tv-result
