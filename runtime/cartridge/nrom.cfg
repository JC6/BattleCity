MEMORY {
    ZP: start=$0002, size=$00FE, type=rw, file="";
    OCC: start=$0100, size=$0068, type=rw, file="";
    RAM: start=$0300, size=$0468, type=rw, file="";
    HEADER: start=$0000, size=$10, file=%O;
    PRG: start=$8000, size=$7FFA, file=%O, fill=yes;
    VEC: start=$FFFA, size=$6, file=%O;
    CHR: start=$0000, size=$2000, file=%O;
}
SEGMENTS {
    ZEROPAGE: load=ZP, type=zp;
    HEADER: load=HEADER, type=ro;
    STARTUP: load=PRG, type=ro;
    CODE: load=PRG, type=ro;
    RODATA: load=PRG, type=ro;
    DATA: load=PRG, run=RAM, type=rw, define=yes;
    DEMO: load=PRG, type=ro;
    ENDING: load=PRG, type=ro;
    OCCUPANCY: load=OCC, type=bss;
    BSS: load=RAM, type=bss, define=yes;
    VECTORS: load=VEC, type=ro;
    CHARS: load=CHR, type=ro;
}
